name: Test low confidence with empty ignore patterns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          supermodel-api-key: 'fake-api-key-for-testing'
          comment-on-pr: 'false'
          fail-on-dead-code: 'false'
          ignore-patterns: '[]'
          min-confidence: 'low'
          timeout-seconds: '30'

      - name: Assert action accepts low confidence and empty ignore-patterns
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should accept 'low' as a valid min-confidence value and '[]' as ignore-patterns.
          # It may fail due to invalid API key, but should not fail due to bad input parsing.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
