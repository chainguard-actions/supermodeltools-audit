name: Test missing required API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without required API key (expect failure)
        id: action
        uses: .
        with:
          supermodel-api-key: ''
          comment-on-pr: 'false'
          fail-on-dead-code: 'false'
        continue-on-error: true

      - name: Assert action failed due to missing required input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with empty API key, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with empty/missing API key"
