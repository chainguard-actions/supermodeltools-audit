name: Test custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          supermodel-api-key: 'fake-api-key-for-testing'
          comment-on-pr: 'false'
          fail-on-dead-code: 'false'
          ignore-patterns: '["**/*.test.js", "**/*.spec.ts", "**/node_modules/**"]'
          min-confidence: 'high'
          timeout-seconds: '30'
          cli-version: 'latest'

      - name: Assert action accepts custom options without crashing on input parsing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should accept the custom options without crashing on input parsing.
          # It may fail due to invalid API key, but should not fail due to bad input format.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME (inputs were accepted)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
