name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          supermodel-api-key: 'fake-api-key-for-testing'
          comment-on-pr: 'false'
          fail-on-dead-code: 'false'
          timeout-seconds: '30'

      - name: Assert outputs are defined or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COUNT: ${{ steps.action.outputs.dead-code-count }}
          JSON_OUT: ${{ steps.action.outputs.dead-code-json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "dead-code-count: $COUNT"
          echo "dead-code-json: $JSON_OUT"
          # The action either succeeds (with outputs) or fails gracefully with an API error.
          # Both are acceptable — we just verify it doesn't hang or produce unexpected output.
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            # If it succeeded, dead-code-count should be a number
            if [ -n "$COUNT" ]; then
              echo "dead-code-count is set: $COUNT"
              if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
                echo "FAIL: dead-code-count is not a number: $COUNT"
                exit 1
              fi
            fi
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
