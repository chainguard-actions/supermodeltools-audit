name: Test bad API key format warning
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with wrong-format API key (no smsk_ prefix)
        id: action
        uses: .
        with:
          supermodel-api-key: 'totally_wrong_format_key'
          comment-on-pr: 'false'
          fail-on-dead-code: 'false'
        continue-on-error: true

      - name: Assert action failed (bad key format still causes API failure)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with bad-format API key, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with bad-format API key"
