name: Test fail-on-dead-code input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with fail-on-dead-code: 'true' - action should still fail at API call
      # (not at input parsing), confirming the boolean input is accepted correctly.
      - id: action-fail-true
        uses: .
        continue-on-error: true
        with:
          supermodel-api-key: 'smsk_fake_key_for_testing'
          comment-on-pr: 'false'
          fail-on-dead-code: 'true'

      - name: Assert action failed (fail-on-dead-code true accepted, fails at API)
        env:
          OUTCOME: ${{ steps.action-fail-true.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with fail-on-dead-code=true"

      # Test with fail-on-dead-code: 'false' - action should also fail at API call
      - id: action-fail-false
        uses: .
        continue-on-error: true
        with:
          supermodel-api-key: 'smsk_fake_key_for_testing'
          comment-on-pr: 'false'
          fail-on-dead-code: 'false'

      - name: Assert action failed (fail-on-dead-code false accepted, fails at API)
        env:
          OUTCOME: ${{ steps.action-fail-false.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with fail-on-dead-code=false"
