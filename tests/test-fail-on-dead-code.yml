name: Test fail-on-dead-code input flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with fail-on-dead-code enabled
        id: action
        uses: .
        with:
          supermodel-api-key: 'smsk_invalid_key_for_testing'
          comment-on-pr: 'false'
          fail-on-dead-code: 'true'
        continue-on-error: true

      - name: Assert action failed (API call fails before dead-code check)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # With an invalid key, the action fails at the API call stage.
          # The fail-on-dead-code flag is accepted as a valid boolean input.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed (fail-on-dead-code input accepted)"
