name: Test fail-on-dead-code false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          supermodel-api-key: 'fake-api-key-for-testing'
          comment-on-pr: 'false'
          fail-on-dead-code: 'false'
          timeout-seconds: '30'

      - name: Assert action did not fail due to dead-code flag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          # With fail-on-dead-code=false, the action should not fail because of dead code.
          # It may fail due to invalid API key (auth error), but not due to dead code logic.
          # We verify the step ran (not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with fail-on-dead-code=false (outcome=$OUTCOME)"
