name: Test ignore-patterns input parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with ignore-patterns JSON array
        id: action
        uses: .
        with:
          supermodel-api-key: 'smsk_invalid_key_for_testing'
          comment-on-pr: 'false'
          fail-on-dead-code: 'false'
          ignore-patterns: '["**/tests/**", "**/fixtures/**", "**/*.mock.ts"]'
        continue-on-error: true

      - name: Assert action failed at API call (not at JSON parsing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail at the API call stage (401 invalid key),
          # not at JSON parsing of ignore-patterns. Either way it should fail.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action failed as expected (at API call, not JSON parsing)"
